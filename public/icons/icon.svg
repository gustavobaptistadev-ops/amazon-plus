<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Fundo com cantos arredondados estilo app iOS/Android -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Círculo sutil de destaque -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Símbolo: Folha estilizada da Amazônia + Sinal de Mais (Plus) -->
  <g filter="url(#shadow)">
    <!-- Folha Esquerda -->
    <path d="M 256 120 C 180 180 160 270 210 350 C 230 310 245 260 256 220 Z" fill="#10b981" />
    <!-- Folha Direita -->
    <path d="M 256 120 C 332 180 352 270 302 350 C 282 310 267 260 256 220 Z" fill="#34d399" />
    <!-- Haste central da folha -->
    <path d="M 256 120 L 256 390" stroke="#064e3b" stroke-width="8" stroke-linecap="round" />
    
    <!-- Sinal PLUS (+) em Dourado reluzente -->
    <g transform="translate(256, 260)">
      <!-- Barra Horizontal -->
      <rect x="-65" y="-18" width="130" height="36" rx="18" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />
      <!-- Barra Vertical -->
      <rect x="-18" y="-65" width="36" height="130" rx="18" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />
    </g>
  </g>
  
  <!-- Texto Amazon Plus -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">AMAZON PLUS</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#a7f3d0" text-anchor="middle" letter-spacing="4">GESTÃO DE ESTOQUE</text>
</svg>
